<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk Web - Evolução</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Animação para o Requisito 1 (Prioridade Alta piscando) */
    @keyframes piscar {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .badge-piscando {
      animation: piscar 1s infinite;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar / Menu Superior da SPA -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#" onclick="mudarTela('dashboard')">HelpDesk Web</a>
      <div class="navbar-nav">
        <a class="nav-link" href="#" onclick="mudarTela('dashboard')">Dashboard</a>
        <a class="nav-link" href="#" onclick="mudarTela('listagem')">Chamados</a>
        <a class="nav-link" href="#" onclick="mudarTela('cadastro')">Novo Chamado</a>
      </div>
    </div>
  </nav>

  <!-- Container Principal da SPA (Onde as telas mudam sem recarregar) -->
  <div class="container" id="app">
    <!-- O conteúdo dinâmico entra aqui via JavaScript -->
  </div>

  <!-- Nosso arquivo JavaScript -->
  <script src="app.js"></script>
</body>
</html>
